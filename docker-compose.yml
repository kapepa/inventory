services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: inventory
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
      - "-c"
      - "password_encryption=md5"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d inventory" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - inventory-network

  app:
    image: node:24
    container_name: inventory-app
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/inventory"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_WS_URL: "http://localhost:3000"
      NEXT_PUBLIC_API_URL: "http://localhost:3000/api"
      NODE_ENV: "development"
    command: sh -c "if [ ! -d node_modules/.bin ]; then npm install; fi && npx prisma generate && npx prisma migrate deploy && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - inventory-network
    profiles:
      - dev

  app-prod:
    image: node:24
    container_name: inventory-app-prod
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_prod:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/inventory"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_WS_URL: "http://localhost:3000"
      NEXT_PUBLIC_API_URL: "http://localhost:3000/api"
      NODE_ENV: "production"
    command: sh -c "npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build && npm run start:prod"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - inventory-network
    profiles:
      - prod

  postgres-test:
    image: postgres:16-alpine
    container_name: inventory-postgres-test
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: inventory_test
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
      - "-c"
      - "password_encryption=md5"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d inventory_test" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - inventory-network
    profiles:
      - test

volumes:
  postgres_data:
  node_modules:
  node_modules_prod:
  next_cache:
  postgres_test_data:

networks:
  inventory-network:
    driver: bridge
